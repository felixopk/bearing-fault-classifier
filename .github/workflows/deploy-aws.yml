name: Deploy to AWS ECS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: bearing-classifier
  ECS_CLUSTER: bearing-classifier-cluster
  ECS_SERVICE: bearing-classifier-service
  ECS_TASK_DEFINITION: bearing-classifier-task
  CONTAINER_NAME: bearing-classifier-container


jobs:
  # Job 1: Lint and Test
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug — show repo structure
        run: |
          echo "📂 Repo structure:"
           ls -R $GITHUB_WORKSPACE
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
            pip install -r $GITHUB_WORKSPACE/requirements.docker.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          flake8 app/ src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test imports
        run: |
          python -c "from app.main import app; print('✅ App imports OK')"
          python -c "from app.download_models import ensure_models_exist; print('✅ Download module OK')"

  # Job 2: Build and Push to ECR
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Push to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Output image URI
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          
          echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # Job 3: Deploy to ECS
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Get service URL
        id: get-url
        run: |
          # Get ALB DNS name
          LOAD_BALANCER=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text | cut -d':' -f6 | cut -d'/' -f2)
          
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names bearing-classifier-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          
          echo "url=http://${ALB_DNS}" >> $GITHUB_OUTPUT
          echo "dns=${ALB_DNS}" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          echo "⏳ Waiting for service to be healthy..."
          sleep 30
          
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f -s "${{ steps.get-url.outputs.url }}/health"; then
              echo "✅ Health check passed!"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Retry $RETRY_COUNT/$MAX_RETRIES..."
            sleep 15
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Deployment Summary
        run: |
          echo "🎉 Deployment successful!"
          echo ""
          echo "🔗 URLs:"
          echo "  ALB DNS: ${{ steps.get-url.outputs.url }}"
          echo "  API Health: ${{ steps.get-url.outputs.url }}/health"
          echo "  API Docs: ${{ steps.get-url.outputs.url }}/docs"
          echo "  Custom Domain: http://api.opkclodz.com (after DNS setup)"
          echo ""
          echo "📊 Service Details:"
          echo "  Cluster: ${{ env.ECS_CLUSTER }}"
          echo "  Service: ${{ env.ECS_SERVICE }}"
          echo "  Image: ${{ needs.build.outputs.image }}"

  # Job 4: Notify on Failure
  notify-failure:
    name: Notify Deployment Failure
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: failure()
    steps:
      - name: Deployment Failed
        run: |
          echo "❌ Deployment pipeline failed!"
          echo "Check the logs above for details."
          exit 1